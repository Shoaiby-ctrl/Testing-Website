<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bin Sohail - Wholesale Medicine Shop</title>
    <link rel="stylesheet" href="css/profile.css" />
</head>

<body>
    <div class="main-content">
        <!-- NAVBAR SECTION -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <img src="img/logo.png" alt="Bin Sohail Logo" class="logo-img">
                    <div class="logo-text">
                        <div class="brand">Bin Sohail</div>
                        <div class="sub">wholesale</div>
                    </div>
                </div>

                <div class="nav-toggle" id="navToggle" aria-label="menu">&#9776;</div>

                <ul class="nav-links" id="navMenu">
                    <li><a href="#">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="contact-us.html">Contact</a></li>
                    <li><a href="chatbot.html">Chatbot</a></li>

                    <li class="user-menu-container desktop-user-menu">
                        <div class="user-name-trigger">
                            John Doe <span class="arrow">▼</span>
                        </div>
                        <div class="user-dropdown-content">
                            <a href="#">My Profile</a>
                            <a href="#">Logout</a>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="mobile-menu" id="mobileMenu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact-us.html">Contact</a></li>
                <li><a href="chatbot.html">Chatbot</a></li>

                <li class="user-menu-container mobile-user-item">
                    <div class="user-name-trigger">
                        John Doe ▼
                    </div>
                    <div class="user-dropdown-content">
                        <a href="#">My Profile</a>
                        <a href="#">Logout</a>
                    </div>
                </li>
            </ul>
        </div>

        <!-- PAGE HEADER -->
        <section class="page-header">
            <img src="img/img99.jpg" alt="Medicines Banner">
        </section>


        <!-- PROFILE SECTION -->
        <section class="profile-section">
            <div class="profile-wrapper">

                <!-- LEFT MENU -->
                <div class="profile-sidebar">
                    <button class="side-btn active">My Profile</button>
                    <button class="side-btn">My Orders</button>
                    <button class="side-btn">Change Password</button>
                    <!-- <button class="side-btn logout">Logout</button> -->
                </div>

                <!-- RIGHT FORM -->
                <div class="profile-content">
                    <h2>Personal Information</h2>

                    <form class="profile-form">
                        <label>Name</label>
                        <input type="text" placeholder="Enter your name">

                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">

                        <label>Phone</label>
                        <input type="text" placeholder="Enter your phone number">

                        <label>Address</label>
                        <textarea placeholder="Enter your full address"></textarea>

                        <button type="submit" class="save-btn">Save Changes</button>
                    </form>
                </div>

            </div>
        </section>




    </div>


    <footer class="footer">
        <p>© 2025 Bin Sohail Wholesale Medicine Shop. All Rights Reserved.</p>
    </footer>

    <!-- load JS -->
    <script>
        // User dropdown
        document.addEventListener("DOMContentLoaded", function() {

            // 1. Mobile Menu Toggle
            const navToggle = document.getElementById("navToggle");
            const mobileMenu = document.getElementById("mobileMenu");

            if (navToggle && mobileMenu) {
                navToggle.addEventListener("click", function(e) {
                    e.stopPropagation();
                    if (mobileMenu.style.display === "block") {
                        mobileMenu.style.display = "none";
                    } else {
                        mobileMenu.style.display = "block";
                    }
                });
            }

            // 2. User Dropdown Toggle (Universal)
            const userTriggers = document.querySelectorAll(".user-name-trigger");

            userTriggers.forEach(trigger => {
                trigger.addEventListener("click", function(e) {
                    e.stopPropagation();

                    // Add 'active' class to trigger for styling
                    this.classList.toggle("active");

                    // Find the next sibling which is the dropdown content
                    const dropdown = this.nextElementSibling;

                    // Close other dropdowns first
                    document.querySelectorAll(".user-dropdown-content").forEach(d => {
                        if (d !== dropdown) d.classList.remove("show");
                    });
                    document.querySelectorAll(".user-name-trigger").forEach(t => {
                        if (t !== this) t.classList.remove("active");
                    });

                    // Toggle current
                    dropdown.classList.toggle("show");
                });
            });

            // 3. Close when clicking outside
            window.addEventListener("click", function() {
                if (mobileMenu) mobileMenu.style.display = "none";

                document.querySelectorAll(".user-dropdown-content").forEach(d => {
                    d.classList.remove("show");
                });
                document.querySelectorAll(".user-name-trigger").forEach(t => {
                    t.classList.remove("active");
                });
            });
        });
    </script>
</body>

</html>
