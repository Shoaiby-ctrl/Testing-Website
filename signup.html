<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bin Sohail - Wholesale Medicine Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="css/signup.css" />
</head>

<body>
    <div class="main-content">
        <!-- NAVBAR SECTION -->
        <nav class="navbar">
            <div class="nav-container">
                <!-- logo area (image + text) -->
                <div class="nav-logo">
                    <img src="img/logo.png" alt="Bin Sohail Logo" class="logo-img">
                    <div class="logo-text">
                        <div class="brand">Bin Sohail</div>
                        <div class="sub">wholesale</div>
                    </div>
                </div>

                <!-- toggle for mobile -->
                <div class="nav-toggle" id="navToggle" aria-label="menu">&#9776;</div>

                <!-- desktop nav links -->
                <ul class="nav-links" id="navMenu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="#contact">Contact</a></li>
                    <li><a href="signup.html">Signup</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </div>
        </nav>

        <!-- Mobile-only menu (slides down) -->
        <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="#contact ">Contact</a></li>
                <li><a href="signup.html">Signup</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>

        <!-- PAGE HEADER -->
        <section class="page-header">
            <img src="img/img90.jfif" alt="Medicines Banner">
        </section>

        <!-- SIGNUP SECTION -->
        <section class="signup-section">
            <div class="signup-box">

                <h2>Create Account</h2>
                <p class="signup-subtitle">Join us to order medicines easily</p>

                <form id="signupForm">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter your name">
                        <small class="error"></small>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email">
                        <small class="error"></small>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Enter password">
                        <small class="error"></small>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm password">
                        <small class="error"></small>
                    </div>

                    <button type="submit" class="btn signup-btn">Sign Up</button>

                </form>

                <p class="signup-footer">
                    Already have an account? <a href="login.html">Login</a>
                </p>
            </div>
        </section>

    </div>


    <footer class="footer">
        <p>© 2025 Bin Sohail Wholesale Medicine Shop. All Rights Reserved.</p>
    </footer>

    <!-- load JS -->
    <script src="js/app.js"></script>
</body>

</html>
